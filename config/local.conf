[[local|localrc]]

# Passwords
ADMIN_PASSWORD=secret
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD

# Logging
LOGFILE=$DEST/logs/stack.sh.log
VERBOSE=True
LOG_COLOR=True

# Neutron - enable Service Type Framework
enable_plugin neutron https://opendev.org/openstack/neutron
enable_service q-svc
enable_service q-agt
enable_service q-dhcp
enable_service q-l3
enable_service q-meta

# Disable some services to speed up installation
disable_service horizon
disable_service tempest

# Use Python 3
USE_PYTHON3=True

# Neutron configuration for plugin development
Q_PLUGIN=ml2
Q_ML2_TENANT_NETWORK_TYPE=vxlan
Q_ML2_PLUGIN_MECHANISM_DRIVERS=openvswitch
Q_AGENT=openvswitch

# Enable Neutron service type framework
NEUTRON_SERVICE_TYPE_FRAMEWORK=True

# Git base
GIT_BASE=https://opendev.org

# Host IP - use the VM IP
HOST_IP=192.168.40.11
SERVICE_HOST=192.168.40.11

